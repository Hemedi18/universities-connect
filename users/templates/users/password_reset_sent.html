{% extends 'business/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-success">
                <div class="card-body p-5 text-center">
                    <div class="mb-4 text-success">
                        <i class="bi bi-check-circle-fill" style="font-size: 3rem;"></i>
                    </div>
                    <h3 class="mb-3">Request Sent</h3>
                    <p class="text-muted">If an account exists with that email, we have notified the administrator.</p>
                    <p class="mb-4">Please allow some time for the admin to process your request and contact you.</p>
                    <a href="{% url 'users:login' %}" class="btn btn-success">Return to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
